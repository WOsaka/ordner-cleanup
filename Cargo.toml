[package]
name = "ordner-cleanup"
version = "0.1.0"
edition = "2021"
description = "Scan und Analyse-Bericht für Ordnersysteme (Windows)"
license = "MIT"

[lib]
name = "ordner_cleanup"
path = "src/lib.rs"

[[bin]]
name = "ordner-cleanup"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
thiserror = "2"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
rstest = "0.26"

[profile.release]
lto = true
codegen-units = 1
strip = true
