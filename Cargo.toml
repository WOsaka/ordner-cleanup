[package]
name = "ordner-cleanup"
version = "0.1.0"
edition = "2021"
description = "Scan, Analyse-Bericht und sicheres Aufräumen (Quarantäne, Undo) für Ordnersysteme (Windows)"
license = "MIT OR Apache-2.0"

[lib]
name = "ordner_cleanup"
path = "src/lib.rs"

[[bin]]
name = "ordner-cleanup"
path = "src/main.rs"

# Dasselbe ohne Konsolenfenster, für die Aufgabenplanung
[[bin]]
name = "ordner-cleanup-bg"
path = "src/bin/ordner-cleanup-bg.rs"

# Grafische Oberfläche (egui), ohne Konsolenfenster
[[bin]]
name = "ordner-cleanup-gui"
path = "src/bin/ordner-cleanup-gui.rs"

[dependencies]
aho-corasick = "1.1.5"
anyhow = "1"
askama = "0.16.1"
bytesize = "2.7.0"
chrono = "0.4.45"
clap = { version = "4", features = ["derive"] }
crossbeam-channel = "0.5.17"
csv = "1.4.0"
ctrlc = "3.5.2"
# egui: Version fest gepinnt; ohne Default-Features (kein http/image, siehe CI-Sperre)
eframe = { version = "=0.36.2", default-features = false, features = ["accesskit", "default_fonts", "persistence", "wgpu", "glow"] }
egui_extras = { version = "=0.36.2", default-features = false }
egui_plot = "0.37.0"
globset = "0.4"
indicatif = "0.18.6"
kamadak-exif = "0.6.1"
pdf-extract = "0.12.1"
quick-xml = "0.42.0"
rayon = "1.12.0"
regex = "1.13.1"
rfd = { version = "0.17", default-features = false }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2"
toml = "0.9"
toml_edit = "0.25"
ureq = { version = "3.4.2", default-features = false }
windows = { version = "0.62", features = ["UI_Notifications", "Data_Xml_Dom", "Foundation", "Win32_System_WinRT", "Media_Ocr", "Graphics_Imaging", "Data_Pdf", "Storage", "Storage_Streams", "Globalization", "Foundation_Collections", "UI"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Cryptography", "Win32_System_Diagnostics_Debug", "Win32_System_Threading", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_IO", "Win32_System_Registry", "Win32_UI_Shell"] }
xxhash-rust = { version = "0.8.19", features = ["xxh3"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
rstest = "0.26"

[profile.release]
lto = true
codegen-units = 1
strip = true
