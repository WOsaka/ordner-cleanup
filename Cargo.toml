[package]
name = "ordner-cleanup"
version = "0.1.0"
edition = "2021"
description = "Scan, Analyse-Bericht und sicheres Aufräumen (Quarantäne, Undo) für Ordnersysteme (Windows)"
license = "MIT"

[lib]
name = "ordner_cleanup"
path = "src/lib.rs"

[[bin]]
name = "ordner-cleanup"
path = "src/main.rs"

[dependencies]
anyhow = "1"
askama = "0.16.1"
bytesize = "2.7.0"
chrono = "0.4.45"
clap = { version = "4", features = ["derive"] }
crossbeam-channel = "0.5.17"
csv = "1.4.0"
ctrlc = "3.5.2"
globset = "0.4"
indicatif = "0.18.6"
rayon = "1.12.0"
regex = "1.13.1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2"
toml = "0.9"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_IO", "Win32_UI_Shell"] }
xxhash-rust = { version = "0.8.19", features = ["xxh3"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
rstest = "0.26"

[profile.release]
lto = true
codegen-units = 1
strip = true
