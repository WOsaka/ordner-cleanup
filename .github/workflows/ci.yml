name: ci
on:
  push:
    branches: [dev, main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - name: Keine Netzwerk-Crates
        shell: pwsh
        run: |
          $hits = cargo tree -e normal --prefix none | Select-String -Pattern '^(reqwest|hyper|ureq|curl)\b'
          if ($hits) { $hits; exit 1 }
      - run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: ordner-cleanup-windows
          path: target/release/ordner-cleanup.exe
