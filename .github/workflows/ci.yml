name: ci
on:
  push:
    branches: [dev, main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - name: Keine Netzwerk-Crates
        shell: pwsh
        run: |
          # ureq ist erlaubt: nur für das lokale LLM (Loopback, ohne TLS, siehe content/llm.rs)
          $hits = cargo tree -e normal --prefix none | Select-String -Pattern '^(reqwest|hyper|curl|isahc|attohttpc|rustls|native-tls|openssl)\b'
          if ($hits) { $hits; exit 1 }
      - run: cargo build --release
      - name: Auslieferung zusammenstellen
        shell: pwsh
        run: |
          # Die Hilfe der GUI öffnet README.md und docs\dokumentation.md neben den exe-Dateien
          New-Item -ItemType Directory -Force dist\docs | Out-Null
          Copy-Item target\release\ordner-cleanup.exe, target\release\ordner-cleanup-bg.exe, target\release\ordner-cleanup-gui.exe dist\
          Copy-Item README.md dist\
          Copy-Item docs\dokumentation.md dist\docs\
      - uses: actions/upload-artifact@v4
        with:
          name: ordner-cleanup-windows
          path: dist/
